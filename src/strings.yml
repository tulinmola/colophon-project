# Every word the layout says, in every language the site is written in.
# A string missing a language fails `npm run verify`: nothing here is long
# enough to excuse a page half in one tongue and half in another.

# The first thing a keyboard reaches, jumping past the navigation to the prose.
skipToText:
  en: Skip to the text

# Announced by a screen reader for the navigation of sections. Never shown.
sections:
  en: Sections

# Announced by a screen reader for the trail of sections above a page.
breadcrumb:
  en: Breadcrumb

# The line at the foot of every page.
footer:
  en: Written in the open under the MIT licence.

# Follows the prose, before a link to the repository the page is written in.
keptIn:
  en: This page is kept in

# The page recording what the site was made from.
imprintTitle:
  en: The imprint

imprintDescription:
  en: The repositories this site is made from, and the commit each of them stood at when it was last built.

imprintIntro:
  en: A manuscript says at its end who copied it and from what. This site is copied from three repositories, and this is the account of them as they stood when these pages were last written.

imprintRepository:
  en: Repository

imprintCommit:
  en: Commit

# Stands in for a commit when a page was built from a tree with changes in it.
imprintUnclean:
  en: an unclean tree
